packages:
  - 'packages/*/*'
  - '!packages/vx/styles'
  - 'apps/*'
  - 'apps_*/*'

catalog:
  '@internationalized/date': 3.12.4
  '@tanstack/react-hotkeys': ^0.10.0
  framer-motion: ^12.40.0
  react-aria-components: 1.21.1
  yaml: 2.9.1

# vx-bot/NOTE: Resolve docs packages' upstream peer names to the workspace's Vezham forks.
# vx-bot/TODO: Remove these overrides when the published @vx-oss docs packages use
# @vx-oss package names in their imports and peer dependencies.
overrides:
  fumadocs-core: npm:@vx-oss/docs-core@1.0.15
  fumadocs-ui: npm:@vx-oss/docs-base-ui@1.0.15

# vx-bot/NOTE: Package lifecycle scripts are required by workspace dependencies.
enablePrePostScripts: true

# vx-bot/NOTE: Hoist internal packages so tools relying on Node.js resolution
# (e.g. Storybook, Vite plugins, ESLint, etc.) can resolve them consistently.
publicHoistPattern:
  - '*@vezham/*'
  - '*@vx-oss/*'
  - '*@vx-pro/*'

minimumReleaseAge: 10080 # wjdlz/NOTE: days in minutes - 5 = 7200, 7 = 10080, 14 = 20160
minimumReleaseAgeExclude:
  - '@vx-cli/*'
  - '@vx-oss/*'
  - '@vezham/*'

allowBuilds:
  heroui-pro: true
  '@heroui-pro/react': true
  heroui-native-pro: true
  lightningcss: true
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  '@vx-oss/heroui-v2-shared-utils': false
  '@zowe/secrets-for-zowe-sdk': false
  less: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'pino@9.14.0'
  - 'semver@5.7.2'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
